<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es"
      xmlns="http:www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title></title>
    </h:head>
    <h:body>
        <p:card style="width: 35rem; margin-bottom: 2em">
            <f:facet name="title">Gestionar Asignaturas</f:facet>

            <h:panelGrid columns="3">

                <p:outputLabel for="txfCodigo" value="Código : " />
                <p:inputText id="txfCodigo"></p:inputText>
                <p:message for="txfCodigo"></p:message>

                <p:outputLabel for="txfNombre" value="Nombre : " />
                <p:inputText id="txfNombre"></p:inputText>
                <p:message for="txfNombre"></p:message>

                <p:outputLabel for="txfCreditos" value="Créditos : " />
                <p:inputNumber id="txfCreditos"></p:inputNumber>
                <p:message for="txfCreditos"></p:message>

                <p:outputLabel for="txfIntensidad" value="Intensidad : " />
                <p:inputNumber id="txfIntensidad"></p:inputNumber>
                <p:message for="txfIntensidad"></p:message>

            </h:panelGrid>

        </p:card>
    </h:body>
</html>
